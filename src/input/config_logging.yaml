# src/input/config_logging.yaml
# Configuration du logger pour l'application de portefeuille.

version: 1
disable_existing_loggers: false
open_logging_file: false

formatters:
  standard:
    format: "%(asctime)s [%(levelname)s] %(name)s – %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout

  file:
    class: logging.FileHandler
    level: DEBUG
    formatter: standard
    filename: "portfolio.log"
    encoding: "utf-8"

loggers:
  portfolio_sorbonne:
    level: DEBUG
    handlers: [console, file]
    propagate: false
